[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "Upload KML or zipped Shapefiles and get CRS-aware area/length measurements per feature."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.48",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are idiomatic
